name: Windows x64 VST3
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vst3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install web build dependencies
        run: npm ci
      - name: Validate parameter and preset data
        run: node --test tests/*.test.js
      - name: Configure Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build-vst3 -A x64 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run Steinberg VST3 validator
        shell: pwsh
        run: |
          cmake --build build-vst3 --config Release --parallel 2 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native audio tests
        shell: pwsh
        run: |
          ctest --test-dir build-vst3 -C Release --output-on-failure 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and package Windows binary
        shell: pwsh
        run: |
          node scripts/package-vst3.mjs build-vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path 'build-vst3/package/*' -DestinationPath 'CLA-3A-Studio-Windows-x64.zip' -Force
          (Get-FileHash 'CLA-3A-Studio-Windows-x64.zip' -Algorithm SHA256).Hash.ToLower() + '  CLA-3A-Studio-Windows-x64.zip' | Set-Content -Encoding utf8 'SHA256SUMS.txt'
      - name: Publish downloadable release
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v0.1.1' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag CLA-3A-Studio-Windows-x64.zip SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag CLA-3A-Studio-Windows-x64.zip SHA256SUMS.txt --target $env:GITHUB_SHA --title "CLA-3A Studio $tag - Windows x64" --notes-file INSTALL-VST3.txt --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-vst3-build-logs
          path: |
            configure.log
            build.log
            test.log
      - name: Publish machine-readable build report
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          gh api "repos/$repo/git/ref/heads/build-status" *> $null
          if ($LASTEXITCODE -ne 0) {
            $ref = @{ ref='refs/heads/build-status'; sha=$env:GITHUB_SHA } | ConvertTo-Json
            $refPath = Join-Path $env:RUNNER_TEMP 'cla-build-ref.json'
            [IO.File]::WriteAllText($refPath,$ref)
            gh api --method POST "repos/$repo/git/refs" --input $refPath *> $null
          }
          $log = ''
          foreach ($file in @('configure.log','build.log','test.log')) {
            if (Test-Path $file) { $log += "`n$file`n" + ((Get-Content $file -Tail 300) -join "`n") }
          }
          $report = @{ result='${{ job.status }}'; commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; run_url="https://github.com/$repo/actions/runs/$env:GITHUB_RUN_ID"; log=$log } | ConvertTo-Json -Depth 4
          $body = @{ message="Build report $env:GITHUB_RUN_ID"; branch='build-status'; content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($report)) }
          $previous = gh api "repos/$repo/contents/build-status.json?ref=build-status" --jq .sha 2>$null
          if ($LASTEXITCODE -eq 0) { $body.sha=$previous }
          $bodyPath = Join-Path $env:RUNNER_TEMP 'cla-build-report.json'
          [IO.File]::WriteAllText($bodyPath,($body | ConvertTo-Json -Depth 4))
          gh api --method PUT "repos/$repo/contents/build-status.json" --input $bodyPath *> $null
